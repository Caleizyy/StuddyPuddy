server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's own DNS. Asking it again every few seconds lets nginx see new backend
  # containers when you run `docker compose up --scale backend=2`.
  resolver 127.0.0.11 valid=5s;

  location /api/ {
    set $backend http://backend:3000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build files never change, so browsers may keep them
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Any other address is a page of the single-page app (for example /tasks after a refresh)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
